name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 7
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      # 🔍 デバッグステップ（重要）
- name: Locate solution file for debugging
  shell: pwsh
  run: |
    Get-ChildItem -Recurse -Filter *.sln | ForEach-Object { Write-Host $_.FullName }

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path "${{ runner.temp }}\scanner" -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}\scanner"

      - name: Build and analyze
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # SonarCloud analysis start
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" begin `
            /k:"suganuma-hikaru_LM" `
            /o:"suganuma-hikaru" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.scanner.skipJreProvisioning=true

          # ⚠️ 現時点ではパスが不明なので、正しい .sln 位置がわかるまで一時的にコメントアウト
          # dotnet restore "<正しい .sln のパス>"
          # dotnet build "<正しい .sln のパス>" --no-restore

          # SonarCloud analysis end（パスが確定したら build するため、今は一時無効）
          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end `
            /d:sonar.token="$env:SONAR_TOKEN"
