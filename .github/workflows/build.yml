name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner

      # ← ここで DLL を LMDVP 配下のすべての bin\Release にコピー
      - name: Copy external DLLs to all output dirs
        shell: pwsh
        run: |
          $sourceDir = "${{ github.workspace }}\LM\bin"
          $targetRoot = "${{ github.workspace }}\LMDVP"

          Write-Host "Copying external DLLs from $sourceDir to all bin\Release directories under $targetRoot"

          Get-ChildItem -Path $targetRoot -Recurse -Directory |
            ForEach-Object {
              $binDir = Join-Path $_.FullName "bin\Release"
              if (Test-Path $binDir) {
                Copy-Item "$sourceDir\*.dll" -Destination $binDir -Force
                Write-Host "Copied DLLs to $binDir"
              }
            }

      - name: Build and analyze
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          Write-Host "Current directory:"
          Get-Location

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" begin `
            /k:"suganuma-hikaru_LM" `
            /o:"suganuma-hikaru" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.scanner.skipJreProvisioning=true

          # MSBuild のパスを取得
          $msbuildPath = (& "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe)
          Write-Host "MSBuild path: $msbuildPath"

          # ソリューションをビルド
          & $msbuildPath "D:\a\LM\LM\LMDVP\Jp.Co.Nrs.LM.sln" /p:Configuration=Release /t:Rebuild

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner" end `
            /d:sonar.token="$env:SONAR_TOKEN"
